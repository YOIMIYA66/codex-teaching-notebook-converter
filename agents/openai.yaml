interface:
  display_name: "Teaching Notebook Converter"
  short_description: "Build researched, information-dense notebook lessons."
  default_prompt: "Convert this existing engineering notebook into a teaching copy. Preserve its executable workflow; identify the major technologies and use web search to explain why each was selected, its project-specific advantages, tradeoffs, alternatives, version context, and source links. Prefer official Paddle documentation, repositories, release notes, AI Studio, and official community sources for Paddle claims. Route each teaching element before rendering it: use imagegen for moderately high-density process, architecture, dependency, causality, tradeoff, or integrated system visuals, and use Markdown tables or inline HTML cards for exact lists and status data. For Paddle logo-bearing images, attach a hashed official Paddle logo reference and require exact, attributed brand reproduction. Produce inspection, research-source, manifest, prompt-pack, asset-hash, and validation artifacts."
